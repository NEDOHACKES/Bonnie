name: Fetch legacy Fabric mappings for source recovery

on:
  push:
    branches:
      - recovery/decompile-26.3

permissions:
  contents: read

jobs:
  mappings:
    runs-on: ubuntu-latest
    steps:
      - name: Download Yarn and intermediary mappings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          curl --fail --location --retry 3 --output work/yarn-1.20.1+build.10-v2.jar 'https://maven.fabricmc.net/net/fabricmc/yarn/1.20.1+build.10/yarn-1.20.1+build.10-v2.jar'
          curl --fail --location --retry 3 --output work/intermediary-1.20.1.jar 'https://maven.fabricmc.net/net/fabricmc/intermediary/1.20.1/intermediary-1.20.1-v2.jar'
          unzip -p work/yarn-1.20.1+build.10-v2.jar mappings/mappings.tiny > work/yarn.tiny
          unzip -p work/intermediary-1.20.1.jar mappings/mappings.tiny > work/intermediary.tiny
          head -n 3 work/yarn.tiny
          head -n 3 work/intermediary.tiny
          wc -l work/*.tiny

      - name: Upload mappings
        uses: actions/upload-artifact@v4
        with:
          name: legacy-minecraft-mappings
          path: work/*.tiny
          retention-days: 1
