name: Prepare temporary Java decompiler

on:
  push:
    branches:
      - recovery/decompile-26.3

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Download CFR decompiler
        run: |
          set -euo pipefail
          mkdir -p work
          curl --fail --location --retry 3 --output work/cfr-0.152.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar
          sha256sum work/cfr-0.152.jar | tee work/cfr.sha256
          java -version

      - name: Upload temporary decompiler tool
        uses: actions/upload-artifact@v4
        with:
          name: temporary-cfr-decompiler
          path: |
            work/cfr-0.152.jar
            work/cfr.sha256
          retention-days: 1
